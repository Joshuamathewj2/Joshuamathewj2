<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="voidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040407"/>
      <stop offset="50%" stop-color="#0B0719"/>
      <stop offset="100%" stop-color="#040407"/>
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#4F46E5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#040407" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="matrixRain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E9D5FF" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyanRain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.11"/>
    </pattern>
  </defs>

  <style>
    .hud-mono { font: 600 10px 'JetBrains Mono', Consolas, monospace; fill: #A1A1AA; letter-spacing: 3px; }
    .hud-accent { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #C084FC; letter-spacing: 2.5px; }
    .hud-cyan { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #38BDF8; letter-spacing: 2.5px; }
    .hero-name { font: 900 34px 'Arial Black', 'Segoe UI', sans-serif; fill: #FFFFFF; letter-spacing: 4px; }
    .monogram { font: 900 42px 'Arial Black', 'Segoe UI', sans-serif; fill: #FFFFFF; letter-spacing: -1px; }
    .matrix-char { font: 700 10px 'JetBrains Mono', Consolas, monospace; fill: #a855f7; opacity: 0.32; }
    .panel-title { font: 800 11px 'JetBrains Mono', Consolas, monospace; fill: #F5F5F5; letter-spacing: 2px; }
    .panel-sub { font: 500 9.5px 'JetBrains Mono', Consolas, monospace; fill: #A1A1AA; letter-spacing: 1px; }
  </style>

  <!-- Base Void & Grid -->
  <rect width="960" height="400" rx="20" fill="url(#voidBg)" stroke="#27272A" stroke-width="1.5"/>
  <rect width="960" height="400" rx="20" fill="url(#cyberGrid)"/>
  <circle cx="480" cy="185" r="240" fill="url(#centerAura)"/>

  <!-- ═══ ANIMATED PURPLE DIGITAL MATRIX RAIN STREAMS ═══ -->
  <g opacity="0.75" filter="url(#glow)">
    <!-- Left Matrix Columns -->
    <rect x="42" y="-90" width="2" height="75" rx="1" fill="url(#matrixRain)">
      <animate attributeName="y" values="-90;420" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="78" y="-120" width="2" height="95" rx="1" fill="url(#cyanRain)">
      <animate attributeName="y" values="-120;420" dur="4.1s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="118" y="-80" width="2" height="65" rx="1" fill="url(#matrixRain)">
      <animate attributeName="y" values="-80;420" dur="2.9s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="164" y="-110" width="2" height="85" rx="1" fill="url(#matrixRain)">
      <animate attributeName="y" values="-110;420" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="210" y="-70" width="2" height="60" rx="1" fill="url(#cyanRain)">
      <animate attributeName="y" values="-70;420" dur="3.1s" begin="2.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="260" y="-100" width="2" height="80" rx="1" fill="url(#matrixRain)">
      <animate attributeName="y" values="-100;420" dur="4.4s" begin="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Right Matrix Columns -->
    <rect x="700" y="-100" width="2" height="80" rx="1" fill="url(#matrixRain)">
      <animate attributeName="y" values="-100;420" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="750" y="-75" width="2" height="65" rx="1" fill="url(#cyanRain)">
      <animate attributeName="y" values="-75;420" dur="3.2s" begin="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="796" y="-110" width="2" height="90" rx="1" fill="url(#matrixRain)">
      <animate attributeName="y" values="-110;420" dur="3.6s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="842" y="-85" width="2" height="70" rx="1" fill="url(#matrixRain)">
      <animate attributeName="y" values="-85;420" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="882" y="-120" width="2" height="95" rx="1" fill="url(#cyanRain)">
      <animate attributeName="y" values="-120;420" dur="4.2s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="918" y="-90" width="2" height="75" rx="1" fill="url(#matrixRain)">
      <animate attributeName="y" values="-90;420" dur="3.5s" begin="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ═══ PERSPECTIVE CYBERPUNK HORIZON GRID (BOTTOM) ═══ -->
  <g opacity="0.38">
    <line x1="0" y1="320" x2="960" y2="320" stroke="#7C3AED" stroke-width="1"/>
    <line x1="0" y1="342" x2="960" y2="342" stroke="#7C3AED" stroke-width="1.2"/>
    <line x1="0" y1="368" x2="960" y2="368" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="0" y1="396" x2="960" y2="396" stroke="#C084FC" stroke-width="1.8"/>
    <!-- Perspective Rays from Center (480, 260) -->
    <line x1="480" y1="320" x2="60" y2="400" stroke="#4F46E5" stroke-width="1"/>
    <line x1="480" y1="320" x2="200" y2="400" stroke="#4F46E5" stroke-width="1"/>
    <line x1="480" y1="320" x2="340" y2="400" stroke="#7C3AED" stroke-width="1"/>
    <line x1="480" y1="320" x2="480" y2="400" stroke="#a855f7" stroke-width="1.2"/>
    <line x1="480" y1="320" x2="620" y2="400" stroke="#7C3AED" stroke-width="1"/>
    <line x1="480" y1="320" x2="760" y2="400" stroke="#4F46E5" stroke-width="1"/>
    <line x1="480" y1="320" x2="900" y2="400" stroke="#4F46E5" stroke-width="1"/>
  </g>

  <!-- ═══ CORNER HUD BRACKETS & SYSTEM MARKERS ═══ -->
  <g stroke="#a855f7" stroke-width="2" fill="none" opacity="0.75">
    <path d="M 22 46 L 22 22 L 46 22"/>
    <path d="M 914 22 L 938 22 L 938 46"/>
    <path d="M 22 354 L 22 378 L 46 378"/>
    <path d="M 914 378 L 938 378 L 938 354"/>
  </g>
  <text x="58" y="36" class="hud-mono">PORTFOLIO // V3.0</text>
  <text x="800" y="36" class="hud-mono">CHENNAI · IN</text>
  <text x="58" y="372" class="hud-cyan">SYS 100 // ONLINE</text>
  <text x="765" y="372" class="hud-accent">CORE_SYNC // ACTIVE</text>

  <!-- ═══ LEFT FLOATING HUD PANEL (OPERATOR TELEMETRY) ═══ -->
  <g transform="translate(46, 98)">
    <rect width="235" height="154" rx="12" fill="#090812" fill-opacity="0.88" stroke="#4F46E5" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="0" y1="32" x2="235" y2="32" stroke="#27272A" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="20" class="hud-accent">SYSTEM ONLINE</text>

    <text x="18" y="56" class="panel-title">▸ AI SYSTEMS</text>
    <text x="18" y="76" class="panel-title" style="fill:#C084FC;">▸ COMPUTER VISION</text>
    <text x="18" y="96" class="panel-title" style="fill:#38BDF8;">▸ FULL-STACK WEB</text>
    <text x="18" y="116" class="panel-title">▸ 3D WEBGL ENGINE</text>

    <!-- Animated Mini Matrix Equalizer -->
    <g transform="translate(18, 128)">
      <rect x="0" y="4" width="12" height="6" rx="1.5" fill="#4F46E5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="16" y="4" width="12" height="6" rx="1.5" fill="#7C3AED"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></rect>
      <rect x="32" y="4" width="12" height="6" rx="1.5" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="48" y="4" width="12" height="6" rx="1.5" fill="#C084FC"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="64" y="4" width="12" height="6" rx="1.5" fill="#38BDF8"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></rect>
      <text x="86" y="10" class="panel-sub" style="fill:#10B981;">OPEN TO INTERNSHIPS</text>
    </g>
  </g>

  <!-- ═══ RIGHT FLOATING HUD PANEL (MATRIX DIAGNOSTICS) ═══ -->
  <g transform="translate(679, 98)">
    <rect width="235" height="154" rx="12" fill="#090812" fill-opacity="0.88" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="0" y1="32" x2="235" y2="32" stroke="#27272A" stroke-width="1"/>
    <text x="18" y="20" class="hud-cyan">// TELEMETRY MATRIX</text>

    <text x="18" y="56" class="panel-sub">INSTITUTION : <tspan fill="#F5F5F5" font-weight="700">LICET CSE '28</tspan></text>
    <text x="18" y="76" class="panel-sub">ACADEMIC    : <tspan fill="#C084FC" font-weight="700">8.9 / 10.0 CGPA</tspan></text>
    <text x="18" y="96" class="panel-sub">HACKERRANK  : <tspan fill="#38BDF8" font-weight="700">RANK #11 / 1,773</tspan></text>
    <text x="18" y="116" class="panel-sub">REPOSITORIES: <tspan fill="#10B981" font-weight="700">37 INDEXED</tspan></text>

    <!-- Animated Throughput Progress Bar -->
    <rect x="18" y="130" width="198" height="6" rx="3" fill="#181824"/>
    <rect x="18" y="130" width="175" height="6" rx="3" fill="url(#arcGrad)" filter="url(#glow)">
      <animate attributeName="width" values="110;198;150;198;110" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ═══ CENTER PORTFOLIO LOADER REACTOR (480, 162) ═══ -->
  <g transform="translate(480, 162)">
    <!-- Outer Rotating Tick Ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <circle r="108" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 15.85" opacity="0.8"/>
      <circle r="104" fill="none" stroke="#3f3f46" stroke-width="5" stroke-dasharray="1 6.54" opacity="0.6"/>
    </g>

    <!-- Counter-Rotating Cyan/Purple Arc Ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6.5s" repeatCount="indefinite"/>
      <circle r="94" fill="none" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="45 110 16 130" stroke-linecap="round" filter="url(#glow)"/>
    </g>

    <!-- Main Glowing Progress Arc Ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
      <circle r="80" fill="none" stroke="#1f1b2e" stroke-width="6"/>
      <circle r="80" fill="none" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="380 130" filter="url(#glow)"/>
    </g>

    <!-- Inner Pulsing Halo -->
    <circle r="62" fill="#07060E" stroke="#a855f7" stroke-width="1.5" filter="url(#heavyGlow)">
      <animate attributeName="r" values="58;65;58" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Monogram JA -->
    <text x="0" y="15" text-anchor="middle" class="monogram" stroke="#C084FC" stroke-width="1">JA</text>
  </g>

  <!-- ═══ BOTTOM NAME & SEGMENTED MATRIX BAR (480, 315) ═══ -->
  <text x="480" y="314" text-anchor="middle" class="hero-name" filter="url(#glow)">
    JOSHUA A<tspan fill="#a855f7">.</tspan>
  </text>

  <!-- 20-Segment Animated Loader Bar -->
  <g transform="translate(352, 332)">
    <rect x="0" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.0s" repeatCount="indefinite"/></rect>
    <rect x="13" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.1s" repeatCount="indefinite"/></rect>
    <rect x="26" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="39" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="52" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="65" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="78" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="91" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="104" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="117" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/></rect>
    <rect x="130" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.0s" repeatCount="indefinite"/></rect>
    <rect x="143" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.1s" repeatCount="indefinite"/></rect>
    <rect x="156" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="169" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.3s" repeatCount="indefinite"/></rect>
    <rect x="182" width="10" height="4" rx="2" fill="#a855f7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.4s" repeatCount="indefinite"/></rect>
    <rect x="195" width="10" height="4" rx="2" fill="#38BDF8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect x="208" width="10" height="4" rx="2" fill="#38BDF8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.6s" repeatCount="indefinite"/></rect>
    <rect x="221" width="10" height="4" rx="2" fill="#38BDF8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.7s" repeatCount="indefinite"/></rect>
    <rect x="234" width="10" height="4" rx="2" fill="#38BDF8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.8s" repeatCount="indefinite"/></rect>
    <rect x="247" width="10" height="4" rx="2" fill="#38BDF8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.9s" repeatCount="indefinite"/></rect>
  </g>
</svg>
